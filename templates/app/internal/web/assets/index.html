<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__APP__</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0d1117; color: #e6edf3; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .card { width: min(560px, calc(100% - 40px)); padding: 28px 30px; border-radius: 16px;
          background: #131a24; border: 1px solid #1f2a38; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.2px; }
  p  { margin: 0 0 18px; color: #93a7c4; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
  dt { color: #7d90ad; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  code { background: #0b1220; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
  <main class="card">
    <h1>__APP__</h1>
    <p>Приложение работает на этом роутере (Entware). Данные ниже отдаёт <code>/api/session</code>.</p>
    <dl>
      <dt>Версия</dt><dd id="version">—</dd>
      <dt>Хост</dt><dd id="host">—</dd>
      <dt>Время</dt><dd id="time">—</dd>
      <dt>Конфиг</dt><dd id="config">—</dd>
    </dl>
  </main>
  <script>
    fetch('/api/session', { cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => {
        document.getElementById('version').textContent = d.version || '—';
        document.getElementById('host').textContent = d.host || '—';
        document.getElementById('time').textContent = d.time || '—';
        document.getElementById('config').textContent = d.config || '—';
      })
      .catch(() => { document.getElementById('version').textContent = 'нет связи с API'; });
  </script>
</body>
</html>
